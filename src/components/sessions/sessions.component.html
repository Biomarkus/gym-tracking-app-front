<div class="container">
  <div class="row justify-content-md-center">
    @for(session of sessions(); track session.id){
      <div class="col col-lg-4">
        <ion-card class="ex-card" color="tertiary">
          <ion-card-header class="ex-card-header-container">
            <ion-card-title>{{ session.title }}</ion-card-title>
            <ion-card-subtitle>{{ formatDate(session.date) }}</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content> Card Content </ion-card-content>
          <ion-button id="open-modal" color="light" expand="block">Edit Session</ion-button>
        </ion-card>
      </div>
    }
    <div class="col col-lg-4 col-">
      <ion-card id="add-session-card" class="ex-card" color="warning">
        <ion-card-header class="ex-card-header-container">
          <ion-card-title>New Session</ion-card-title>
        </ion-card-header>
        <ion-fab >
          <ion-fab-button id="add-session-btn" (click)="navigateToNewSession()" color="light">
            <ion-icon name="add"></ion-icon>
          </ion-fab-button>
        </ion-fab>
      </ion-card>
    </div>
  </div>
</div>
