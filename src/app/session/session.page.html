<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{sessionTitle()}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-layout">

    <!-- LEFT: main content -->
    <div class="main-content">
      <app-exercises
        [exercises]="exercises()"
        (openExercise)="openExercise($event)"
        [isExerciseModalOpen]="isExerciseModalOpen()"
      ></app-exercises>
    </div>

    <!-- RIGHT: scrollable sidebar -->
    <div class="sidebar">
      @for(sessionExercise of sessionExercises(); track $index){
        <div class="exercise-card">
          <span>{{`Ex: ${sessionExercise.exercise?.title}: ${sessionExercise.weight} kgs | ${sessionExercise.reps} times`}}</span>
          <ion-button  size="small" color="danger">✕</ion-button>
        </div>
      }
    </div>
  </div>
  <ion-button color="danger" class="close-sessions-button" shape="round">
    Close Session
  </ion-button>


  <app-add-ex-modal
    [isOpen]="isExerciseModalOpen()"
    (addExercise)="onAddExercises($event)"
    (closeExercise)="onCloseExercise()"
    [exercise]="selectedExercise()"
  />

</ion-content>
