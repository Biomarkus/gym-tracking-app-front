<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>New Session</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-layout">

    <!-- LEFT: main content -->
    <div class="main-content">
      <app-exercises
        [exercises]="exercises()"
        (openExercise)="openExercise($event)"
        [isExerciseModalOpen]="isExerciseModalOpen()"
      ></app-exercises>
    </div>

    <!-- RIGHT: scrollable sidebar -->
    <div class="sidebar">
      <div class="exercise-card">
        <span>title</span>
        <ion-button  size="small" color="danger">✕</ion-button>
      </div>
    </div>
  </div>

  <app-add-ex-modal
    [isOpen]="isExerciseModalOpen()"
    (addExercise)="onAddExercise()"
    (closeExercise)="onCloseExercise()"
    [exercise]="selectedExercise()"
  ></app-add-ex-modal>
</ion-content>
